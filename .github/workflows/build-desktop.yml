name: Build Desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Exact v-prefixed release tag; empty runs validation only
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:desktop-release-config
      - run: npm run test:brand-assets
      - run: npm run test:desktop-workflow
      - run: npm run test:electron
      - run: npm run test:mac-signing
      - run: npm run test:release-artifacts
      - run: npm run test:release-tag
      - run: npm run test:packaged-resources
      - run: npm run test:packaged-app
      - run: npm run check:desktop-release-config
      - run: npm run test:run
      - run: npm run build
      - run: npm run test:e2e
      - name: Validate workflow syntax with actionlint
        run: docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace rhysd/actionlint:1.7.12 .github/workflows/build-desktop.yml

  package:
    needs: validate
    if: inputs.release_tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mac-arm64
            target: mac-arm64
            os: macos-latest
            command: npm run desktop:pack -- --mac --arm64
            artifact: release/*-mac-arm64.dmg
          - id: mac-x64
            target: mac-x64
            os: macos-latest
            command: npm run desktop:pack -- --mac --x64
            artifact: release/*-mac-x64.dmg
          - id: windows-x64
            target: windows-x64
            os: windows-latest
            command: npm run desktop:pack:win -- --x64
            artifact: release/*-windows-x64.exe
          - id: linux-x64
            target: linux-x64
            os: ubuntu-latest
            command: npm run desktop:pack:linux -- --x64
            artifact: |
              release/*-linux-x64.AppImage
              release/*-linux-x64.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-release-tag.mjs "$RELEASE_TAG"
      - run: ${{ matrix.command }}
      - run: npm run desktop:smoke:packaged-app
      - run: node scripts/verify-release-artifacts.mjs release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.id }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: package
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-release-tag.mjs "$RELEASE_TAG"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets
          merge-multiple: true
      - run: node scripts/verify-release-artifacts.mjs release-assets
      - name: Upload validated desktop release set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-pet-pause-desktop-${{ inputs.release_tag }}
          path: release-assets/
          if-no-files-found: error
