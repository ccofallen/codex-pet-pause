name: Build Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run -- src/android src/i18n src/features/pets
      - run: npm run android:sync
      - run: npm run android:test:native
      - run: cd android && ./gradlew lintDebug
      - name: Build debug APK
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
        run: cd android && ./gradlew assembleDebug
      - name: Upload debug APK
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: codex-pet-pause-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Require Android release signing secrets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required for signed Android tag builds" >&2
              missing=1
            fi
          done
          exit "$missing"
      - name: Decode Android release keystore
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/android-signing/release.jks"
          printf 'ANDROID_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/android-signing/release.jks" >> "$GITHUB_ENV"
      - name: Build signed universal release APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: cd android && ./gradlew --no-daemon clean :app:assembleRelease
      - name: Stage deterministic Android release assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          ARTIFACT_DIR="$RUNNER_TEMP/android-release"
          APK_NAME="Codex-Pet-Pause-$VERSION-android-universal.apk"
          mkdir -p "$ARTIFACT_DIR"
          cp android/app/build/outputs/apk/release/app-release.apk "$ARTIFACT_DIR/$APK_NAME"
          (
            cd "$ARTIFACT_DIR"
            sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          )
          printf 'ANDROID_ARTIFACT_DIR=%s\n' "$ARTIFACT_DIR" >> "$GITHUB_ENV"
          printf 'ANDROID_APK=%s/%s\n' "$ARTIFACT_DIR" "$APK_NAME" >> "$GITHUB_ENV"
          printf 'ANDROID_CHECKSUM=%s/%s.sha256\n' "$ARTIFACT_DIR" "$APK_NAME" >> "$GITHUB_ENV"
      - name: Verify signed Android release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$ANDROID_APK"
          node scripts/verify-android-release.mjs "$ANDROID_ARTIFACT_DIR"
      - name: Upload signed Android artifact
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: codex-pet-pause-android-${{ github.ref_name }}
          path: ${{ runner.temp }}/android-release/
          if-no-files-found: error
      - name: Publish Android release assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME"; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "Codex Pet Pause $GITHUB_REF_NAME" || gh release view "$GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" "$ANDROID_APK" "$ANDROID_CHECKSUM" --clobber
