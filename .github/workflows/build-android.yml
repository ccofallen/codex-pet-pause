name: Build Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Exact v-prefixed release tag; empty builds debug only
        required: false
        type: string
        default: ""
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      ANDROID_STORE_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:android-release
      - run: npm run test:run -- src/android src/i18n src/features/pets
      - run: npm run android:sync
      - run: npm run android:test:native
      - run: cd android && ./gradlew lintDebug
      - name: Build debug APK
        if: inputs.release_tag == ''
        run: cd android && ./gradlew assembleDebug
      - name: Upload debug APK
        if: inputs.release_tag == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-pet-pause-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Verify Android release tag
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-release-tag.mjs "$RELEASE_TAG"
      - name: Require Android release signing secrets
        if: inputs.release_tag != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required for signed Android release builds" >&2
              missing=1
            fi
          done
          exit "$missing"
      - name: Decode Android release keystore
        if: inputs.release_tag != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/android-signing"
          chmod 700 "$RUNNER_TEMP/android-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/android-signing/release.jks"
          printf 'ANDROID_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/android-signing/release.jks" >> "$GITHUB_ENV"
      - name: Build signed universal release APK
        if: inputs.release_tag != ''
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: cd android && ./gradlew --no-daemon clean :app:assembleRelease
      - name: Stage named Android release assets
        if: inputs.release_tag != ''
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          ARTIFACT_DIR="$RUNNER_TEMP/android-release"
          APK_NAME="Codex-Pet-Pause-$VERSION-android-universal.apk"
          mkdir -p "$ARTIFACT_DIR"
          cp android/app/build/outputs/apk/release/app-release.apk "$ARTIFACT_DIR/$APK_NAME"
          (
            cd "$ARTIFACT_DIR"
            sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          )
          printf 'ANDROID_ARTIFACT_DIR=%s\n' "$ARTIFACT_DIR" >> "$GITHUB_ENV"
          printf 'ANDROID_APK=%s/%s\n' "$ARTIFACT_DIR" "$APK_NAME" >> "$GITHUB_ENV"
      - name: Verify signed Android release
        if: inputs.release_tag != ''
        shell: bash
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$ANDROID_APK"
          ANDROID_APKSIGNER="$APKSIGNER" node scripts/verify-android-release.mjs "$ANDROID_ARTIFACT_DIR"
      - name: Upload signed Android artifact
        if: inputs.release_tag != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-pet-pause-android-${{ inputs.release_tag }}
          path: ${{ runner.temp }}/android-release/
          if-no-files-found: error
      - name: Clean up Android release keystore
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/android-signing"
