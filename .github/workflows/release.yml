name: Publish Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    permissions:
      contents: read
    uses: ./.github/workflows/build-android.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit

  desktop:
    permissions:
      contents: read
    uses: ./.github/workflows/build-desktop.yml
    with:
      release_tag: ${{ github.ref_name }}

  publish:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify release tag
        run: node scripts/verify-release-tag.mjs "$GITHUB_REF_NAME"
      - name: Download validated desktop artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: codex-pet-pause-desktop-${{ github.ref_name }}
          path: ${{ runner.temp }}/release/desktop
      - name: Download validated Android artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: codex-pet-pause-android-${{ github.ref_name }}
          path: ${{ runner.temp }}/release/android
      - name: Validate complete release artifact sets
        env:
          DESKTOP_RELEASE_DIR: ${{ runner.temp }}/release/desktop
          ANDROID_RELEASE_DIR: ${{ runner.temp }}/release/android
        run: |
          node scripts/verify-release-artifacts.mjs "$DESKTOP_RELEASE_DIR"
          node scripts/verify-android-release.mjs "$ANDROID_RELEASE_DIR"
      - name: Publish complete release after validation
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_RELEASE_DIR: ${{ runner.temp }}/release/desktop
          ANDROID_RELEASE_DIR: ${{ runner.temp }}/release/android
        run: |
          if ! gh release view "$GITHUB_REF_NAME"; then
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "Codex Pet Pause $GITHUB_REF_NAME" || gh release view "$GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" "$DESKTOP_RELEASE_DIR"/* "$ANDROID_RELEASE_DIR"/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
